<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미궁 연금술사 - 알파</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Training Dashboard (ERA-style overlay) -->
  <div id="training-dashboard">
    <div class="td-header">
      <span class="td-title" id="td-unit-name">【 조교 】</span>
      <span class="td-stamina" id="td-stamina">스태미나: --/--</span>
      <span style="color:#666;cursor:pointer" id="td-close">[닫기]</span>
    </div>
    <div class="td-body">
      <!-- 좌: 감도 바 -->
      <div class="td-section">
        <div class="td-section-title">부위 감도</div>
        <div id="td-sensitivity-bars"></div>
      </div>
      <!-- 우: 상태 + 경험치 -->
      <div class="td-section">
        <div class="td-section-title">상태 수치</div>
        <div id="td-global-state"></div>
        <div class="td-section-title" style="margin-top:6px">경험치</div>
        <div class="td-exp-grid" id="td-exp"></div>
      </div>
    </div>
    <!-- 대사/묘사 -->
    <div class="td-desc" id="td-desc">...</div>
    <!-- 행위 그리드 -->
    <div class="td-actions" id="td-actions"></div>
    <!-- 입력 -->
    <div style="margin-top:8px; display:flex; align-items:center; gap:6px;">
      <span style="color:#4a9eff; font-weight:bold">&gt;</span>
      <input type="text" id="td-input" style="flex:1; background:transparent; border:none; outline:none; color:#e0e0e0; font-family:'D2Coding',monospace; font-size:14px; caret-color:#4a9eff;" placeholder="행위 번호 입력..." autofocus>
    </div>
  </div>

  <!-- Main Game Area -->
  <div id="main-area">
    <div id="game-output"></div>

    <div id="action-bar"></div>

    <div id="quick-buttons">
      <button class="quick-btn" id="inventory-btn">인벤토리</button>
      <button class="quick-btn" id="unit-btn">유닛</button>
      <button class="quick-btn" id="map-btn">지도</button>
    </div>

    <div id="input-area">
      <span id="input-prompt">&gt;</span>
      <input type="text" id="command-input" placeholder="명령어를 입력하세요..." autofocus>
    </div>
  </div>

  <!-- Status Side Panel -->
  <div id="status-panel">
    <!-- Location & Date -->
    <div class="status-section">
      <div class="status-title">현재 위치</div>
      <div id="location-display">—</div>
      <div style="margin-top:6px;">
        <div class="status-row">
          <span class="status-label">날짜</span>
          <span class="status-value" id="date-display">—</span>
        </div>
      </div>
    </div>

    <!-- Player Stats -->
    <div class="status-section">
      <div class="status-title">연금술사 상태</div>
      <div class="status-row">
        <span class="status-label">체력</span>
        <span class="status-value" id="hp-display">—</span>
      </div>
      <div class="bar-container"><div class="bar-fill hp" id="hp-bar" style="width:100%"></div></div>

      <div class="status-row" style="margin-top:6px;">
        <span class="status-label">스태미나</span>
        <span class="status-value" id="stamina-display">—</span>
      </div>
      <div class="bar-container"><div class="bar-fill stamina" id="stamina-bar" style="width:100%"></div></div>

      <div class="status-row" style="margin-top:6px;">
        <span class="status-label">영혼력</span>
        <span class="status-value" id="soulpower-display">—</span>
      </div>
      <div class="bar-container"><div class="bar-fill soul" id="soul-bar" style="width:100%"></div></div>
    </div>

    <!-- Resources -->
    <div class="status-section">
      <div class="status-title">재료 현황</div>
      <div id="materials-display" style="font-size:11px; color:#999;"></div>
    </div>

    <!-- Party -->
    <div class="status-section">
      <div class="status-title">편성 파티</div>
      <div id="party-display">
        <span class="empty-text">편성된 유닛 없음</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
