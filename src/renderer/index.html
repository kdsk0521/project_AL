<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미궁 연금술사 - 알파</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #c8c8c8;
      font-family: "D2Coding", "Consolas", monospace;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── Main Area (left) ── */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Game Output ── */
    #game-output {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #game-output::-webkit-scrollbar {
      width: 6px;
    }
    #game-output::-webkit-scrollbar-track {
      background: #111;
    }
    #game-output::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    /* ── Output Line Styles ── */
    .output-line {
      padding: 1px 0;
    }
    .output-line.system   { color: #4a9eff; }
    .output-line.combat   { color: #ff6b6b; }
    .output-line.danger   { color: #ff6b6b; }
    .output-line.success  { color: #6bff6b; }
    .output-line.heal     { color: #6bff6b; }
    .output-line.lore     { color: #ffd700; }
    .output-line.important{ color: #ffd700; }
    .output-line.unit     { color: #c084fc; }
    .output-line.relation { color: #c084fc; }
    .output-line.command  { color: #888; font-style: italic; }
    .output-line.description { color: #c8c8c8; }
    .output-line.location { color: #4a9eff; font-weight: bold; font-size: 15px; }
    .output-line.menu     { color: #c8c8c8; }
    .output-line.clickable {
      cursor: pointer;
      transition: color 0.15s, padding-left 0.15s;
    }
    .output-line.clickable:hover {
      color: #ffd700;
      padding-left: 8px;
    }
    .output-line.clickable:active {
      color: #ffaa00;
    }
    .output-line.error    { color: #ff4444; }
    .output-line.dim      { color: #666; }

    /* ── Progress Bar Component ── */
    .progress-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 1px 0;
    }
    .progress-bar .bar-label {
      min-width: 36px;
      color: #999;
      font-size: 12px;
    }
    .progress-bar .bar-bg {
      position: relative;
      width: 140px;
      height: 14px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar .bar-fill {
      height: 100%;
      transition: width 0.3s ease;
      border-radius: 1px;
    }
    .progress-bar .bar-text {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #ddd;
      text-shadow: 0 0 2px #000;
    }

    /* ── Column Grid ── */
    .output-columns {
      display: grid;
      gap: 4px 12px;
      margin: 2px 0;
      padding: 0 8px;
    }

    /* ── Action Bar (고정 선택지) ── */
    #action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 16px;
      border-top: 1px solid #333;
      background: #111;
      min-height: 20px;
    }
    #action-bar:empty { display: none; }
    .action-btn {
      background: #1a1a2e;
      color: #c8c8c8;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 12px;
      font-family: "D2Coding", "Consolas", monospace;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover {
      color: #ffd700;
      border-color: #ffd700;
      background: #1a1a3e;
    }
    .action-btn:active {
      color: #ffaa00;
      background: #2a2a3e;
    }
    .action-btn .key {
      color: #4a9eff;
      font-weight: bold;
      margin-right: 4px;
    }

    /* ── Input Area ── */
    #input-area {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-top: 1px solid #222;
      background: #0e0e0e;
    }

    #input-prompt {
      color: #4a9eff;
      font-size: 16px;
      font-weight: bold;
      margin-right: 8px;
      user-select: none;
    }

    #command-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-family: "D2Coding", "Consolas", monospace;
      font-size: 14px;
      caret-color: #4a9eff;
    }

    #command-input::placeholder {
      color: #444;
    }

    /* ── Quick Buttons ── */
    #quick-buttons {
      display: flex;
      gap: 6px;
      padding: 6px 16px;
      border-top: 1px solid #1a1a1a;
      background: #0c0c0c;
    }

    .quick-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #2a2a2a;
      padding: 4px 12px;
      font-family: "D2Coding", "Consolas", monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      background: #222;
      color: #c8c8c8;
      border-color: #4a9eff;
    }

    /* ── Status Panel (right side) ── */
    #status-panel {
      width: 260px;
      min-width: 260px;
      background: #0e0e0e;
      border-left: 1px solid #222;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      font-size: 13px;
    }

    .status-section {
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      padding: 8px 10px;
      background: #111;
    }

    .status-title {
      color: #4a9eff;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      border-bottom: 1px solid #1e1e1e;
      padding-bottom: 4px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .status-label {
      color: #888;
    }

    .status-value {
      color: #c8c8c8;
      font-weight: bold;
    }

    #location-display {
      color: #4a9eff;
      font-weight: bold;
    }

    #date-display {
      color: #ffd700;
    }

    #stamina-display {
      color: #6bff6b;
    }

    #soulpower-display {
      color: #c084fc;
    }

    /* ── HP Bar ── */
    .bar-container {
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      margin-top: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .bar-fill.hp      { background: #6bff6b; }
    .bar-fill.stamina { background: #4a9eff; }
    .bar-fill.soul    { background: #c084fc; }

    /* ── Party Display ── */
    #party-display {
      min-height: 40px;
    }

    .party-member {
      padding: 3px 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 12px;
    }
    .party-member:last-child {
      border-bottom: none;
    }
    .party-member .name {
      color: #c084fc;
    }
    .party-member .info {
      color: #666;
      font-size: 11px;
    }

    .empty-text {
      color: #444;
      font-style: italic;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Main Game Area -->
  <div id="main-area">
    <div id="game-output"></div>

    <div id="action-bar"></div>

    <div id="quick-buttons">
      <button class="quick-btn" id="inventory-btn">인벤토리</button>
      <button class="quick-btn" id="unit-btn">유닛</button>
      <button class="quick-btn" id="map-btn">지도</button>
    </div>

    <div id="input-area">
      <span id="input-prompt">&gt;</span>
      <input type="text" id="command-input" placeholder="명령어를 입력하세요..." autofocus>
    </div>
  </div>

  <!-- Status Side Panel -->
  <div id="status-panel">
    <!-- Location & Date -->
    <div class="status-section">
      <div class="status-title">현재 위치</div>
      <div id="location-display">—</div>
      <div style="margin-top:6px;">
        <div class="status-row">
          <span class="status-label">날짜</span>
          <span class="status-value" id="date-display">—</span>
        </div>
      </div>
    </div>

    <!-- Player Stats -->
    <div class="status-section">
      <div class="status-title">연금술사 상태</div>
      <div class="status-row">
        <span class="status-label">체력</span>
        <span class="status-value" id="hp-display">—</span>
      </div>
      <div class="bar-container"><div class="bar-fill hp" id="hp-bar" style="width:100%"></div></div>

      <div class="status-row" style="margin-top:6px;">
        <span class="status-label">스태미나</span>
        <span class="status-value" id="stamina-display">—</span>
      </div>
      <div class="bar-container"><div class="bar-fill stamina" id="stamina-bar" style="width:100%"></div></div>

      <div class="status-row" style="margin-top:6px;">
        <span class="status-label">영혼력</span>
        <span class="status-value" id="soulpower-display">—</span>
      </div>
      <div class="bar-container"><div class="bar-fill soul" id="soul-bar" style="width:100%"></div></div>
    </div>

    <!-- Resources -->
    <div class="status-section">
      <div class="status-title">재료 현황</div>
      <div id="materials-display" style="font-size:11px; color:#999;"></div>
    </div>

    <!-- Party -->
    <div class="status-section">
      <div class="status-title">편성 파티</div>
      <div id="party-display">
        <span class="empty-text">편성된 유닛 없음</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
